name: tests

on:
  push:
  workflow_dispatch:

jobs:
  build-openrag-from-scratch:
    runs-on: ubuntu-latest
    steps:
      - name: Update apt and install packages
        run: |
          df -h
          echo ${PWD}
          ls -lah /mnt/
          cat /mnt/DATALOSS_WARNING_README.txt
          sudo apt update
          sudo apt install -y curl git jq
          sudo apt clean
          sudo apt autoremove --purge -y

      -
        name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: v2.34.0

      -
        name: Free up space and move Docker storage to /mnt
        run: |
          echo "Stopping Docker..."
          sudo systemctl stop docker

          echo "Creating new Docker root at /mnt/docker..."
          sudo mkdir -p /mnt/docker
          sudo rsync -aqxP /var/lib/docker/ /mnt/docker

          echo "Updating Docker daemon config..."
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json

          cat /etc/docker/daemon.json

          echo "Restarting Docker..."
          sudo systemctl start docker

          echo "Verifying Docker root directory:"
          docker info | grep "Docker Root Dir"

#      -
#        name: Use /mnt instead of default location
#        run: |
#          sudo mkdir -p /mnt/work
#          sudo chown -R ${USER}:${USER} /mnt/work
#          mkdir -p /home/runner/work/
#          ln -s /mnt/work /home/runner/work
#          df -h

      -
        name: Checkout current branch
        uses: actions/checkout@v5
        with:
          submodules: true

      -
        name: Set up mini env
        run: cp .github/workflows/mini/.env ./ && cp .github/workflows/mini/*.yaml ./

      -
        name: Build
        run: docker compose --profile cpu build

      -
        name: Run
        run: |
          docker compose --profile cpu up -d || docker logs openrag-vllm-cpu-1
          .github/workflows/mini/wait_for_healthy.sh openrag-vllm-cpu-1

      -
        name: Cleanup
        run: |
          df -h
          docker container prune -f && docker image prune -f && docker builder prune -f
          df -h

      -
        name: List containers
        run: docker container ls

      -
        name: Detect openrag-cpu ip address
        run: ADDR=`docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' openrag-openrag-cpu-1` && echo ${ADDR} && echo "addr end"

      -
        name: Sleep 10s
        run: sleep 10s

      -
        name: Install Python venv
        run: python3 -m venv venv && source venv/bin/activate && pip3 install -r utility/requirements.txt

      -
        name: Index 500 documents
        run: .github/workflows/mini/index_docs.sh

      -
        name: Prnt
        run: ls -lah && sleep 20s && docker container ls

